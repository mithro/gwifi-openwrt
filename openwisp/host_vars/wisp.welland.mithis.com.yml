---
# Site-specific vars for welland's wisp VM.  NO SECRETS IN THIS FILE.
# Everything identical between sites lives in group_vars/openwisp2.yml.

openwisp2_default_from_email: "openwisp@wisp.welland.mithis.com"

# DELIBERATELY EMPTY — do not add the bare IP here.
#
# This previously listed 10.1.4.2, which was a LATENT BREAKAGE: welland's
# live nginx vhost predates this variable and so does not carry the IP,
# which is the only reason welland's eMMC installs still worked.  The next
# `make deploy-nginx` would have regenerated
#   server_name wisp.welland.mithis.com 10.1.4.2;
# handing :80 to OpenWISP, which 301s to HTTPS — and the netbooted installer
# fetches the factory image as http://10.1.4.2/<factory>.bin by IP literal
# over plain HTTP, with no TLS stack.  That is exactly how monarto broke.
#
# The bare IP belongs to the gwifi-images vhost (rendered by
# gwifi_netboot.sites).  Nothing needs OpenWISP by IP: the pucks' agent uses
# `openwisp.http.url='https://wisp.welland.mithis.com'`, the only name the
# certificate matches.
openwisp2_allowed_hosts: []

certbot_certs:
  - email: "claude@mith.ro"
    domains:
      - "wisp.welland.mithis.com"
