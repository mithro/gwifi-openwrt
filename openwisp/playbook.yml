---
# OpenWISP deployment for a site's wisp VM (Debian 13 / arm64).
#
# Site-agnostic: run it with `-i inventories/<site>`.  Shared vars live in
# group_vars/openwisp2.yml, per-site vars in host_vars/<fqdn>.yml.
#
# Runs the official `openwisp.openwisp2` role (pinned to 25.10.2 via
# requirements.yml) against localhost. Defaults not overridden here are kept
# as the role ships them; for the full list see the installed role at
#   ~/.ansible/roles/openwisp.openwisp2/defaults/main.yml   (on the wisp VM)
# or upstream: github.com/openwisp/ansible-openwisp2 (tag 25.10.2).
# Every override below is deliberate and commented.

- name: Deploy OpenWISP on the wisp VM
  hosts: openwisp2
  become: true
  roles:
    # certbot FIRST: obtain the Let's Encrypt cert before openwisp configures
    # nginx to reference it (role order = run order).
    - geerlingguy.certbot
    - openwisp.openwisp2
  pre_tasks:
    # Both roles apt-install packages; refresh the cache once up front.
    - name: Update APT package cache
      ansible.builtin.apt:
        update_cache: true
      changed_when: false
      retries: 5
      delay: 10
      register: result
      until: result is success
  post_tasks:
    # netaddr (used by openwisp-monitoring for WifiClient vendor naming)
    # ships a static IEEE OUI snapshot frozen at its release; recent
    # allocations (e.g. the Espressif blocks the Tasmota fleet uses) are
    # missing and vendors come out empty. Refresh the registry in the venv
    # from IEEE and rebuild netaddr's indexes — on deploy, and monthly via
    # cron (the script is atomic and self-verifying; see files/).
    - name: Install netaddr OUI registry updater
      ansible.builtin.copy:
        src: files/update-netaddr-oui.sh
        dest: /usr/local/sbin/update-netaddr-oui
        mode: "0755"
    - name: Refresh netaddr OUI registry now
      ansible.builtin.command: /usr/local/sbin/update-netaddr-oui
      register: oui_refresh
      changed_when: "'refreshed OK' in oui_refresh.stdout"
    - name: Refresh netaddr OUI registry monthly
      ansible.builtin.cron:
        name: update-netaddr-oui
        special_time: monthly
        job: /usr/local/sbin/update-netaddr-oui >> /var/log/update-netaddr-oui.log 2>&1
