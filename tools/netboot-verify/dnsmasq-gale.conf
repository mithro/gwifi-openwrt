# Provisioning-only dnsmasq for gale netboot verification.
# Scoped to eth-gwan; no DNS (port=0), no interference with the rig's other nets.
interface=eth-gwan
bind-dynamic
port=0
dhcp-range=192.168.50.50,192.168.50.150,2h
# becomes the DHCP bootfile + next-server that depthcharge netboot reads
dhcp-boot=netboot.itb
enable-tftp
tftp-root=/home/tim/gale-netboot/tftp
log-dhcp
dhcp-leasefile=/home/tim/gale-netboot/leases
